name: Bootstrap validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n install-manager.sh
          bash -n tests/test-manager-bootstrap.sh
      - name: Validate manager-only bootstrap
        run: bash tests/test-manager-bootstrap.sh
