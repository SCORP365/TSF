name: Bootstrap tests

on:
  push:
    branches:
      - test/bootstrap-qr
  pull_request:
    branches:
      - test/bootstrap-qr

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate bootstrap and offline signer launchers
        run: |
          bash -n bootstrap/run.sh
      - name: Compile bootstrap modules
        run: python -m compileall -q bootstrap
      - name: Check command-line entry points
        run: |
          python -m bootstrap.cli --help
          python -m bootstrap.download_archive --help
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
