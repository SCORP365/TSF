name: Bootstrap tests

on:
  push:
    branches:
      - test/bootstrap-qr
  pull_request:
    branches:
      - test/bootstrap-qr

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
